server {
    listen 80;
    server_name stocks.undefasa.com;
    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name stocks.undefasa.com;

    ssl_certificate     /etc/letsencrypt/live/stocks.undefasa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stocks.undefasa.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    # DNS interno de Docker: re-resuelve el nombre del contenedor cada 10s.
    # Necesario porque proxy_pass con nombre estatico cachea la IP al arrancar
    # y da 502 cuando el contenedor se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_stocks apirest-backend;
        proxy_pass http://$upstream_stocks:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
